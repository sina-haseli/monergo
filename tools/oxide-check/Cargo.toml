# Dev-only cross-check harness: verifies monergo's transactions with monero-oxide.
# Not part of the Go module. See README.md.
[package]
name = "oxide-check"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
monero-oxide = { git = "https://github.com/monero-oxide/monero-oxide", rev = "a6b46701fb9b331006d7f2f2278bf51f123b1447" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
