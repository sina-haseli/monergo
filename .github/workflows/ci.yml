name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24.x", "stable"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Dependencies are only the allowed modules
        shell: bash
        run: |
          go mod verify
          extra=$(go list -m all | tail -n +2 | awk '{print $1}' | grep -vxE 'filippo.io/edwards25519|golang.org/x/(crypto|sys|net|term|text)' || true)
          if [ -n "$extra" ]; then echo "unexpected modules: $extra"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
