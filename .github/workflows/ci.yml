name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs the full CI first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.x", "stable"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Dependencies are only the allowed modules
        shell: bash
        run: |
          go mod verify
          extra=$(go list -m all | tail -n +2 | awk '{print $1}' | grep -vxE 'filippo.io/edwards25519|golang.org/x/(crypto|sys|net|term|text)' || true)
          if [ -n "$extra" ]; then echo "unexpected modules: $extra"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # Build the linter with the job's Go so it understands go 1.27 modules.
          install-mode: goinstall

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Fuzz every parser for 20s each
        run: |
          set -e
          for t in \
            "./internal/varint FuzzRoundTrip" \
            "./address/base58 FuzzDecode" \
            "./address/base58 FuzzDecodeAddr" \
            "./address FuzzParse" \
            "./seed FuzzDecode" \
            "./seed FuzzRoundTrip" \
            "./tx FuzzParse" \
            "./tx FuzzParseExtra" \
            "./builder FuzzSign"; do
            set -- $t
            go test -run '^$' -fuzz "^$2\$" -fuzztime 20s "$1"
          done

  oxide-check:
    # Cross-checks our proofs and transactions with monero-oxide (independent Rust
    # implementation). Dev-only; never part of the Go build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0, matches tools/oxide-check/rust-toolchain.toml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/oxide-check/target
          key: oxide-${{ hashFiles('tools/oxide-check/Cargo.lock') }}
      - run: cargo build --release --locked
        working-directory: tools/oxide-check
      - name: Oxide cross-check tests (must not skip)
        run: |
          out=$(go test -count=1 -v -run 'Oxide' ./verify ./builder)
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP'; then echo "oxide tests skipped"; exit 1; fi

  e2e-regtest:
    # Signs real transactions with monergo and submits them to the official
    # monerod on a private regtest chain (coins are mined locally, no funds
    # involved); the official wallet then confirms what it received and sent.
    # See docs/regtest-e2e.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      MONERO_VERSION: v0.18.5.4
      # From hashes.txt, signed by binaryFate
      # (81AC 591F E9C4 B65C 5806 AFC3 F0AF 4D46 2A0B DF92).
      MONERO_SHA256: ba2928962c101b609434bf8c1b43ad59ebe96c5525977284ca599d8bf0f02d10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Official Monero CLI (pinned hash)
        run: |
          set -euo pipefail
          f="monero-linux-x64-${MONERO_VERSION}.tar.bz2"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://downloads.getmonero.org/cli/$f"
          echo "${MONERO_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/monero"
          tar -xjf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/monero" --strip-components=1
          echo "MONERGO_MONEROD=$RUNNER_TEMP/monero/monerod" >> "$GITHUB_ENV"
          echo "MONERGO_WALLET_RPC=$RUNNER_TEMP/monero/monero-wallet-rpc" >> "$GITHUB_ENV"
      - name: Regtest end-to-end (must not skip)
        env:
          MONERGO_E2E_LOGDIR: ${{ runner.temp }}/e2e-logs
        run: |
          mkdir -p "$MONERGO_E2E_LOGDIR"
          set -o pipefail
          go test -count=1 -v -timeout 25m ./internal/e2e | tee "$RUNNER_TEMP/e2e.out"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/e2e.out"; then echo "e2e test skipped"; exit 1; fi
      - name: Daemon and wallet logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
