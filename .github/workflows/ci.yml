name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.x", "stable"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - name: Dependencies are only the allowed modules
        shell: bash
        run: |
          go mod verify
          extra=$(go list -m all | tail -n +2 | awk '{print $1}' | grep -vxE 'filippo.io/edwards25519|golang.org/x/(crypto|sys|net|term|text)' || true)
          if [ -n "$extra" ]; then echo "unexpected modules: $extra"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.15.0
          # Build the linter with the job's Go so it understands go 1.27 modules.
          install-mode: goinstall

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Fuzz every parser for 20s each
        run: |
          set -e
          for t in \
            "./internal/varint FuzzRoundTrip" \
            "./address/base58 FuzzDecode" \
            "./address/base58 FuzzDecodeAddr" \
            "./address FuzzParse" \
            "./seed FuzzDecode" \
            "./seed FuzzRoundTrip" \
            "./tx FuzzParse" \
            "./tx FuzzParseExtra" \
            "./builder FuzzSign"; do
            set -- $t
            go test -run '^$' -fuzz "^$2\$" -fuzztime 20s "$1"
          done

  oxide-check:
    # Cross-checks our proofs and transactions with monero-oxide (independent Rust
    # implementation). Dev-only; never part of the Go build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0, matches tools/oxide-check/rust-toolchain.toml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/oxide-check/target
          key: oxide-${{ hashFiles('tools/oxide-check/Cargo.lock') }}
      - run: cargo build --release --locked
        working-directory: tools/oxide-check
      - name: Oxide cross-check tests (must not skip)
        run: |
          out=$(go test -count=1 -v -run 'Oxide' ./verify ./builder)
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP'; then echo "oxide tests skipped"; exit 1; fi
