name: release

# Push a tag vX.Y.Z whose section "## [X.Y.Z]" exists in CHANGELOG.md. The full
# CI (tests, lint, fuzz, oxide cross-check, regtest end-to-end) runs first; then
# reproducible binaries are built, checked, attested and attached to a draft
# release for a maintainer to review and publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for [$v]"; exit 1
          fi
          {
            echo '> **Unaudited. Do not use with real funds until independently audited.**'
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > notes.md
      - name: Reproducible builds
        run: |
          set -euo pipefail
          build() { # out-dir
            for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
              os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
              for cmd in xmr-sign xmr-prepare; do
                pkg=./cmd/xmr-sign; [ "$cmd" = xmr-prepare ] && pkg=./tools/xmr-prepare
                GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=true -ldflags='-s -w -buildid=' \
                  -o "$1/${cmd}-${GITHUB_REF_NAME}-${os}-${arch}${ext}" "$pkg"
              done
            done
          }
          build dist
          # A second, clean build must be byte-identical.
          go clean -cache
          build "$RUNNER_TEMP/rebuild"
          diff <(cd dist && sha256sum * ) <(cd "$RUNNER_TEMP/rebuild" && sha256sum *)
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist
            notes.md

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
